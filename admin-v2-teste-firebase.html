<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mirai Admin — Biblioteca</title>
<style>
:root{--blue:#557b91;--dark:#36596d;--olive:#8b9270;--cream:#f6f4ee;--line:#ddd7c9}
*{box-sizing:border-box} body{margin:0;background:var(--cream);font-family:Arial,sans-serif;color:#26343c}
header{background:white;border-bottom:1px solid var(--line);padding:22px 18px}
.head{max-width:760px;margin:auto;display:flex;gap:13px;align-items:center}.icon{width:46px;height:46px;border-radius:13px;background:var(--blue);display:grid;place-items:center}
.icon svg{width:27px;stroke:white}.head h1{margin:0;color:var(--dark);font-size:23px}.head small{color:#75838b}
main{max-width:760px;margin:auto;padding:22px 16px 60px}
.card{background:white;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px}
h2{font-size:18px;color:var(--dark);margin:0 0 16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.full{grid-column:1/-1}label{display:block;font-size:11px;font-weight:700;color:var(--olive);text-transform:uppercase;letter-spacing:.06em;margin:0 0 6px}
select,input,textarea{width:100%;padding:13px;border:1px solid var(--line);border-radius:11px;background:white;font:inherit}textarea{resize:vertical;min-height:85px}
.file{border:1px dashed #aeb9b0;border-radius:12px;padding:17px;text-align:center;color:#68777f;background:#fafaf8}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}.btn{border:0;border-radius:11px;padding:12px 16px;font-weight:700}.secondary{background:#edf1f2;color:var(--dark)}.primary{background:var(--blue);color:white}
.preview{padding:13px;border-radius:12px;background:#f4f6f2;margin-top:12px;font-size:14px}.preview b{color:var(--dark)}
@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head>
<body>
<header><div class="head"><div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M4 5c4-1 7 0 8 2v13c-1-2-4-3-8-2z"/><path d="M20 5c-4-1-7 0-8 2v13c1-2 4-3 8-2z"/></svg></div><div><h1>Admin Mirai</h1><small>Teste conectado • Biblioteca do Facilitador</small></div></div></header>
<main>
<section class="card"><h2>Novo conteúdo</h2><div class="grid">
<div><label>Faixa etária</label><select id="age"><option>6–10 anos</option><option selected>11–14 anos</option></select></div>
<div><label>Virtude</label><select id="virtue"></select></div>
<div><label>Encontro</label><select id="meeting"><option value="1">Encontro 1</option><option value="2" selected>Encontro 2 — Consolidação</option></select></div>
<div><label>Tipo de material</label><select id="type"><option>Guia do Facilitador — PDF</option><option>Áudio</option><option>Treinando Virtudes Todos os Dias</option><option>Material para impressão</option><option>Vídeo</option></select></div>
<div class="full"><label>Título</label><input id="title" placeholder="Ex.: Guia do Facilitador"></div>
<div class="full"><label>Descrição curta</label><textarea id="description" placeholder="Descrição que aparecerá para o facilitador"></textarea></div>
<div class="full"><label>Adicionar arquivo</label>
<div class="file">
  <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
    <button type="button" class="btn secondary" id="driveFile">Google Drive</button>
    <button type="button" class="btn secondary" id="chooseFile">Meu dispositivo</button>
  </div>
  <input id="fileInput" type="file" accept=".pdf,.mp3,.m4a,.wav,.mp4,.mov,image/*" style="display:none">
  <div id="fileName" style="margin-top:11px;font-size:13px;">Nenhum arquivo selecionado</div>
</div></div>
<div><label>Status</label><select id="status"><option>Publicado</option><option>Oculto</option></select></div>
</div>
<div class="preview" id="preview"></div>
<div class="actions"><button class="btn secondary">Cancelar</button><button class="btn primary" id="save">Publicar na Biblioteca</button></div>
</section>
<section class="card">
<h2>Conteúdos cadastrados</h2>
<div id="savedList"><div style="opacity:.65;font-size:14px;">Nenhum conteúdo cadastrado neste teste.</div></div>
</section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyCuUQi_s4v0Iat3FkzEfY06lX1NIaDAJ3Y",
 authDomain:"mirai-kokoro.firebaseapp.com",
 projectId:"mirai-kokoro",
 storageBucket:"mirai-kokoro.firebasestorage.app",
 messagingSenderId:"601277675162",
 appId:"1:601277675162:web:b2ab41cbb4709b008a9123"
};
const ADMIN_UID="4jnMbmwV2JbSmKkzcJLBum7ybyK2";
const app=initializeApp(firebaseConfig);
const auth=getAuth(app), db=getFirestore(app);
let adminOk=false;

const lists={
"6–10 anos":["Humildade","Abnegação","Perseverança","Responsabilidade","Paciência","Honestidade","Não Julgamento","Gratidão","Bom Humor","Otimismo","Cuidado com o Corpo","Amor à Natureza e aos Animais","Ajuda ao Próximo","Perdão","Reconciliação","Honrar a Família"],
"11–14 anos":["Humildade","Abnegação","Individuação","Perdão","Utilidade","Igualdade","Fraternidade","Ajuda ao Próximo","Gratidão","Busca do Melhoramento","Não Julgamento"]
};
const $=id=>document.getElementById(id);
const age=$("age"),virtue=$("virtue"),meeting=$("meeting"),type=$("type"),preview=$("preview"),status=$("status");
const fileInput=$("fileInput"),fileName=$("fileName"),save=$("save");

function fill(){
 const old=virtue.value;
 virtue.innerHTML=lists[age.value].map((v,i)=>`<option value="${v}">${i+1}. ${v}</option>`).join("");
 virtue.value=lists[age.value].includes(old)?old:"Abnegação";
 update();
}
function update(){
 preview.innerHTML=`Destino do teste: <b>${age.value} → ${virtue.value} → Encontro ${meeting.value} → ${type.value}</b><br>Status escolhido: <b>${status.value}</b>`;
}
$("chooseFile").onclick=()=>fileInput.click();
$("driveFile").onclick=()=>alert("A integração com o Google Drive será feita depois do teste do cadastro no Firebase.");
fileInput.onchange=()=>fileName.textContent=fileInput.files[0]?.name || "Nenhum arquivo selecionado";
[age,virtue,meeting,type,status].forEach(x=>x.addEventListener("change",()=>x===age?fill():update()));

onAuthStateChanged(auth,user=>{
 adminOk=!!(user && user.uid===ADMIN_UID);
 save.disabled=!adminOk;
 save.textContent=adminOk?"Gravar teste no Firebase":"Entre primeiro no Admin atual";
 if(!adminOk) preview.innerHTML="Abra primeiro o Admin atual e faça login. Depois volte para esta página de teste.";
});

save.onclick=async()=>{
 if(!adminOk) return;
 const titulo=$("title").value.trim(), descricao=$("description").value.trim();
 if(!titulo){alert("Preencha o título.");return}
 save.disabled=true; save.textContent="Gravando…";
 try{
   await addDoc(collection(db,"conteudo"),{
     // tipo desconhecido pelo app atual: impede que este teste apareça nas áreas atuais
     tipo:"biblioteca_v2_teste",
     categoria:"biblioteca-v2-teste",
     materialTipo:type.value,
     titulo,
     descricao,
     faixaEtaria:age.value,
     virtude:virtue.value,
     encontro:Number(meeting.value),
     status:status.value.toLowerCase(),
     versao:2,
     teste:true,
     nomeArquivo:fileInput.files[0]?.name || "",
     link:"",
     criadoEm:serverTimestamp()
   });
   alert("Teste gravado no Firebase com sucesso. Ele não foi publicado na Biblioteca atual.");
   $("title").value=""; $("description").value="";
 }catch(err){
   console.error(err);
   alert("Não foi possível gravar. Não altere nada no Firebase; me envie uma foto desta mensagem se aparecer erro.");
 }finally{
   save.disabled=false; save.textContent="Gravar teste no Firebase";
 }
};
fill();
</script>

</body></html>
